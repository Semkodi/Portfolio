<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Seite nicht gefunden | Page Not Found</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --card: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Dekorative Hintergrund-Glows */
    .glow-1 {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    .glow-2 {
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 40px 30px;
      border-radius: 24px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 2;
      animation: fadeIn 0.8s ease-out;
    }

    .error-code {
      font-size: 120px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--primary), #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      letter-spacing: -2px;
      animation: pulse 3s infinite ease-in-out;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
      font-weight: 500;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--primary);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 12px;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.25);
    }

    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(99, 102, 241, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .divider {
      height: 1px;
      background-color: var(--border);
      margin: 20px 0;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.2));
      }
      50% {
        transform: scale(1.03);
        filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.4));
      }
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <main class="container">
    <div class="error-code">404</div>
    
    <!-- Deutsch -->
    <section aria-label="Fehlermeldung (Deutsch)">
      <h1>Hoppla! Seite nicht gefunden.</h1>
      <p>Die gesuchte Seite existiert leider nicht oder wurde verschoben.</p>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <!-- English -->
    <section aria-label="Error message (English)">
      <h1>Oops! Page not found.</h1>
      <p>The page you are looking for does not exist or has been moved.</p>
    </section>

    <a href="/" class="btn">Zur Startseite | Back to Home</a>
  </main>
</body>
</html>
